name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-api:latest -f docker/Dockerfile .

    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-api:latest

    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-api:latest
          docker stop devops-api-container || true
          docker rm devops-api-container || true
          docker run -d -p 8000:8000 --name devops-api-container ${{ secrets.DOCKERHUB_USERNAME }}/devops-api:latest
